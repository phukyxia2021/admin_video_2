<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản — Video Admin</title>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
  
  <!-- SQLite WebAssembly (sql.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="login.html" class="auth-brand">
          <div class="brand-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </div>
          <span>Video Admin</span>
        </a>
        <h2 class="auth-title">Đăng ký Tài khoản</h2>
        <p class="auth-subtitle">Tạo tài khoản quản trị cục bộ trong file users.db</p>
      </div>

      <!-- Security / Demo Notice -->
      <div class="auth-notice-banner">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>
          <strong>Lưu ý:</strong> Tài khoản được tạo sẽ lưu vào SQLite của trình duyệt. Không dùng thông tin hoặc mật khẩu nhạy cảm của bạn.
        </span>
      </div>

      <form id="registerForm">
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="regFullName">Họ và tên <span class="required">*</span></label>
          <input type="text" id="regFullName" class="form-input" placeholder="Nguyễn Văn A" required autofocus>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="regEmail">Email <span class="required">*</span></label>
          <input type="email" id="regEmail" class="form-input" placeholder="name@domain.com" required>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="regPassword">Mật khẩu (Tối thiểu 8 ký tự) <span class="required">*</span></label>
          <div class="input-password-wrapper">
            <input type="password" id="regPassword" class="form-input" placeholder="••••••••" minlength="8" required>
            <button type="button" class="password-toggle-btn" id="toggleRegPasswordBtn" aria-label="Hiện/ẩn mật khẩu">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
          <input type="password" id="regConfirmPassword" class="form-input" placeholder="••••••••" minlength="8" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" id="regSubmitBtn" style="width: 100%; margin-top: 14px;">
          Tạo tài khoản
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/database.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Redirect if already logged in
      if (window.Auth.redirectIfAuthenticated()) return;

      // Initialize database
      try {
        await window.DatabaseManager.initDatabases();
      } catch (err) {
        window.App.showToast('Lỗi nạp database SQLite: ' + err.message, 'error');
      }

      // Password toggle
      const passInput = document.getElementById('regPassword');
      const toggleBtn = document.getElementById('toggleRegPasswordBtn');
      toggleBtn.addEventListener('click', () => {
        const isPassword = passInput.getAttribute('type') === 'password';
        passInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleBtn.style.color = isPassword ? 'var(--primary)' : 'var(--text-muted)';
      });

      // Form submission
      const form = document.getElementById('registerForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('regFullName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;
        const submitBtn = document.getElementById('regSubmitBtn');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang tạo tài khoản...';

        try {
          const res = await window.Auth.register(name, email, password, confirmPassword);
          if (res.success) {
            window.App.showToast(res.message, 'success');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1000);
          } else {
            window.App.showToast(res.message, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Tạo tài khoản';
          }
        } catch (err) {
          window.App.showToast('Lỗi: ' + err.message, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Tạo tài khoản';
        }
      });
    });
  </script>
</body>
</html>
